<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #2c3e50; }
        p { line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #0969da;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover { background-color: #0451a5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola, mundo!</h1>
        <p>Esta es mi nueva página web alojada de forma gratuita en GitHub Pages.</p>
        <a href="https://github.com" class="btn" target="_blank">Visitar GitHub</a>
    </div>
</body>
</html>
